name: Keymark erkunden (einmalig)
on:
  workflow_dispatch:
  push:
    paths: ['werkzeug/keymark_probe.py', '.github/workflows/keymark_probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u werkzeug/keymark_probe.py
