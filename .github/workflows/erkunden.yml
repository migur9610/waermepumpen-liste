name: Schnittstelle erkunden
on:
  push:
    paths: ['werkzeug/erkunden.py', '.github/workflows/erkunden.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Erreichbarkeit
        run: |
          curl -s https://ipinfo.io/json || true
          for u in https://www.bafa.de https://elan1.bafa.bund.de https://elan1.bafa.bund.de/zvi-ui/wep/waermepumpen https://www.kfw.de; do
            echo "== $u"; curl -4 -sS -o /dev/null -w '%{http_code} %{time_total}s\n' --max-time 20 "$u" || true
          done
          getent ahosts elan1.bafa.bund.de || true
