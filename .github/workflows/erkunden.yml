name: Schnittstelle erkunden
on:
  push:
    paths: ['.github/workflows/erkunden.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p erkundung/probe; cd erkundung/probe
          B=https://elan1.bafa.bund.de
          n=0
          for p in "/zvi-api/wep/waermepumpen?seite=0&anzahl=3" "/zvi-api/wep/waermepumpen?seite=0&anzahl=3&sortierung=markeHersteller,asc" "/zvi-api/wep/waermepumpen/kaeltemittel" "/zvi-api/config/zvi" "/zvi-api/environment-config/zvi" "/zvi-ui/assets/config/zvi" ; do
            n=$((n+1)); c=$(curl -4 -sS --max-time 30 -H 'Accept: application/json' -o p$n.txt -w '%{http_code} %{content_type}' "$B$p"); echo "$n $c $p" | tee -a uebersicht.txt
          done
          grep -oE 'configApiUrl[^,;]{0,120}|applicationClientIdInjectionToken,useValue:[^}]{0,200}' ../js/main*.js | head -5 | tee -a uebersicht.txt || true
      - run: |
          git config user.name "abholdienst"; git config user.email "abholdienst@users.noreply.github.com"
          git add erkundung; git commit -qm "Probe $(date -u +%F)" || true; git push
