name: Schnittstelle erkunden
on:
  push:
    paths: ['.github/workflows/erkunden.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p erkundung/chunks; cd erkundung/chunks
          for c in 107.105066b2b6156d80 158.541baa3d16ffa3d0 177.86a360efa10d56d7 435.e4dc961a5f89dd9c 507.2a0d60929977f86f 739.7249dd9c2648bf51 743.79770008185959f5 787.ad6dc8e2aa40e1b4 815.a2ecb9b11dbbd189 961.c5e4d17c4cd32636; do
            curl -4 -sS --max-time 30 "https://elan1.bafa.bund.de/zvi-ui/$c.js" -o $c.js; echo "$c $(wc -c < $c.js)"
          done
      - run: |
          git config user.name "abholdienst"; git config user.email "abholdienst@users.noreply.github.com"
          git add erkundung; git commit -qm "Chunks $(date -u +%F)" || true; git push
