name: Schnittstelle erkunden
on:
  push:
    paths: ['.github/workflows/erkunden.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p erkundung/probe4; cd erkundung/probe4
          U=https://elan1.bafa.bund.de/zvi-api/wep/waermepumpen; D=$(date -u +%F)
          F1="foerderungAb=le=\"$D\";foerderungBis=ge=\"$D\""
          F2="foerderungAb=le=\"$D\";foerderungBis=ge=\"$D\";einzelabnahme==false"
          n=0
          for a in "$F1|20" "$F2|20" "$F1|500" "$F1|2000"; do
            f="${a%|*}"; z="${a#*|}"; n=$((n+1))
            c=$(curl -4 -sS -G --max-time 60 -H 'Accept: application/json' -o v$n.json -w '%{http_code} %{time_total}' "$U" --data-urlencode "filter=$f" --data-urlencode seite=0 --data-urlencode anzahl=$z)
            echo "$n $c $z $f :: $(head -c 200 v$n.json)" | tee -a uebersicht.txt
          done
          python3 -c "import json;d=json.load(open('v1.json'));print({k:v for k,v in d.items() if k!='inhalt'});print(json.dumps(d['inhalt'][0],ensure_ascii=False,indent=1))" | tee -a uebersicht.txt || true
          ls -la
      - run: |
          git config user.name "abholdienst"; git config user.email "abholdienst@users.noreply.github.com"
          git add erkundung; git commit -qm "Probe4 $(date -u +%F)" || true; git push
