name: Schnittstelle erkunden
on:
  push:
    paths: ['.github/workflows/erkunden.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p erkundung/probe2; cd erkundung/probe2
          U=https://elan1.bafa.bund.de/zvi-api/wep/waermepumpen
          n=0
          while IFS= read -r q; do
            n=$((n+1)); c=$(curl -4 -sS -G --max-time 40 -H 'Accept: application/json' -o v$n.txt -w '%{http_code}' "$U" $q); echo "$n $c $q :: $(head -c 160 v$n.txt)" | tee -a uebersicht.txt
          done <<'Q'
          --data-urlencode seite=0 --data-urlencode anzahl=20
          --data-urlencode seite=0 --data-urlencode anzahl=20 --data-urlencode sortierung=markeHersteller,asc,ic
          --data-urlencode seite=0 --data-urlencode anzahl=20 --data-urlencode filter=markeHersteller=="*a*"
          --data-urlencode seite=0 --data-urlencode anzahl=20 --data-urlencode filter=geraeteBezeichnung=="*"
          --data-urlencode seite=0 --data-urlencode anzahl=20 --data-urlencode filter=markeHersteller=="Daikin*"
          --data-urlencode seite=0 --data-urlencode anzahl=1000 --data-urlencode filter=markeHersteller=="*a*"
          --data-urlencode seite=0 --data-urlencode anzahl=20 --data-urlencode sortierung=anlagenNummer,asc
          --data-urlencode seite=1 --data-urlencode anzahl=20
          --data-urlencode anzahl=20
          --data-urlencode seite=0 --data-urlencode anzahl=20 --data-urlencode filter=einzelAbnahme==false
          Q
      - run: |
          git config user.name "abholdienst"; git config user.email "abholdienst@users.noreply.github.com"
          git add erkundung; git commit -qm "Probe2 $(date -u +%F)" || true; git push
