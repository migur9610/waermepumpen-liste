name: Schnittstelle erkunden
on:
  push:
    paths: ['.github/workflows/erkunden.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  erkunden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seite und Skripte holen
        run: |
          mkdir -p erkundung/js; cd erkundung
          B=https://elan1.bafa.bund.de; S=$B/zvi-ui/wep/waermepumpen
          curl -4 -sS --max-time 30 "$S" -o seite.html
          grep -oE '(src|href)="[^"]+"' seite.html | sed -E 's/^(src|href)="//;s/"$//' | sort -u > links.txt
          cat links.txt
          for l in $(grep -E '\.js' links.txt); do
            case "$l" in http*) u="$l";; /*) u="$B$l";; *) u="$B/zvi-ui/wep/$l";; esac
            f="js/$(basename "${l%%\?*}")"; curl -4 -sS --max-time 30 "$u" -o "$f"; echo "$u $(wc -c <"$f")"
          done
          # zweite Ebene: nachgeladene Chunks
          for c in $(grep -ohE '"[A-Za-z0-9_./-]*chunk[A-Za-z0-9_.-]*\.js"|"[0-9]+\.[a-f0-9]+\.js"' js/*.js 2>/dev/null | tr -d '"' | sort -u | head -80); do
            u="$B/zvi-ui/$c"; f="js/$(basename "$c")"; [ -f "$f" ] || curl -4 -sS --max-time 30 "$u" -o "$f"
          done
          grep -ohE '.{0,150}(zvi-api|/api/|apiUrl|baseUrl|environment).{0,200}' js/*.js | sort -u | head -300 > funde.txt
          grep -ohE '"/?[a-zA-Z0-9_/-]*(waermepumpe|anlage|wep|liste|export|csv|xlsx|pdf)[a-zA-Z0-9_/{}.?=&-]*"' js/*.js | sort -u > pfade.txt
          ls -la js; wc -l funde.txt pfade.txt
      - name: Funde sichern
        run: |
          git config user.name "abholdienst"; git config user.email "abholdienst@users.noreply.github.com"
          git add erkundung; git commit -qm "Erkundung $(date -u +%F)" || true; git push
